<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- style-src 'unsafe-inline': xterm draws terminal colours and the cursor with a stylesheet it
         inserts at run time; without it every agent tile was white with no cursor (measured in the
         selftest). Scripts stay 'self' only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CLI Organizer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
